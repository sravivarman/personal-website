{{ define "main" }}
{{/* This is a fallback template for taxonomy list pages */}}
{{/* Specific templates: tags.html, categories.html, series.html are preferred */}}
<section class="py-12 bg-bg dark:bg-bg" data-animate>
  <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
    <h1 class="text-4xl font-bold text-center mb-4 font-heading text-text-primary dark:text-text-primary">
      <i class="fas fa-list mr-3 text-primary"></i>{{ .Title }}
    </h1>
    
    <div class="grid gap-4 md:grid-cols-2 lg:grid-cols-3 mt-8">
      {{ range .Pages.ByCount }}
      <a href="{{ .RelPermalink }}" class="block group">
        <div class="bg-bg-secondary dark:bg-bg-secondary rounded-lg p-4 shadow-sm hover:shadow-md border border-border-primary dark:border-border-primary transition-all duration-200 flex items-center justify-between">
          <span class="font-medium text-text-primary dark:text-text-primary group-hover:text-primary transition-colors">{{ .Title }}</span>
          <span class="bg-primary-lighter dark:bg-primary-dark text-primary dark:text-primary-light px-3 py-1 rounded-full text-sm">{{ .Count }}</span>
        </div>
      </a>
      {{ end }}
    </div>
  </div>
</section>
{{ end }}
